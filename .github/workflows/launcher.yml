name: Moonrail full gameplay regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/profile_backup_smoke.cjs
